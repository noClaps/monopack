on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: codeberg-tiny-lazy
    strategy:
      matrix:
        versions:
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v6
      - uses: https://code.forgejo.org/actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: GOOS=${{ matrix.versions.goos }} GOARCH=${{ matrix.versions.goarch }} go build
      - run: tar -acf monopack-${{ matrix.versions.goos }}.tar.xz monopack
      - run: mkdir -p dist
      - run: mv monopack-${{ matrix.versions.goos }}.tar.xz dist
      - uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          release-dir: ./dist
          token: ${{ secrets.ACTIONS_RELEASE_TOKEN }}
