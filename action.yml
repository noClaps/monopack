name: Setup monopack
description: Setup monopack

runs:
  using: composite
  steps:
    - run: |
        mkdir -p bin && cd bin
        curl -LO 'https://codeberg.org/noClaps/monopack/releases/download/latest/monopack-linux.tar.xz'
        tar -xf monopack-linux.tar.xz
        install monopack /usr/local/bin/
      shell: bash
